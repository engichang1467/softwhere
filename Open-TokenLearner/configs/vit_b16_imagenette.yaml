# ViT-B/16 + TokenLearner-v1.1 on Imagenette (10-class ImageNet subset).
# Smoke-test config: end-to-end sanity check of the model + training loop on
# a dataset small enough to iterate on quickly. Not a benchmark.

model:
  name: TokenLearnerViT
  img_size: 224
  patch_size: 16
  in_chans: 3
  num_classes: 10
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_dim: 3072
  num_tokens: 8
  tokenlearner_loc: 6
  use_v11: true
  use_fuser: false
  bottleneck_dim: 64
  drop_rate: 0.0
  attn_drop_rate: 0.0

data:
  dataset: imagenette
  root: data/imagenette2-320        # adjust if you extracted elsewhere
  train_split: train
  val_split: val
  num_workers: 4
  pin_memory: true

train:
  epochs: 10
  batch_size: 64
  warmup_epochs: 1
  base_lr: 5.0e-4
  min_lr: 1.0e-6
  weight_decay: 0.05
  optimizer: adamw
  betas: [0.9, 0.999]
  grad_clip_norm: 1.0
  label_smoothing: 0.1
  mixed_precision: true

eval:
  batch_size: 128
  metric: top1

wandb:
  project: opentokenlearner
  entity: null               # set to your team/username, or leave null for default
  tags: [vit, tokenlearner, imagenette, smoke]
  mode: online               # online / offline / disabled (WANDB_MODE env var overrides)
  log_freq: 20               # train/loss + lr log frequency in steps
  log_model: false           # log final checkpoint as a wandb Artifact
  watch_model: false         # wandb.watch — gradients/params, bandwidth-heavy
